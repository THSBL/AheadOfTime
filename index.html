<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ahead Of Time - The assistant for busy calendars</title>
    <meta name="description" content="Calendars tell you when an event starts. Ahead Of Time makes sure you are ready when it does. Drop an entry onto your calendar or plan with our assistant, and Ahead Of Time automatically builds backward preparation milestones." />
    <link rel="canonical" href="https://aheadoftime.app/" />
    <meta property="og:title" content="Ahead Of Time - The assistant for busy calendars" />
    <meta property="og:description" content="Calendars tell you when an event starts. Ahead Of Time makes sure you are ready when it does. Less scrambling. More headspace. Time to actually enjoy it." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aheadoftime.app/" />
    <meta property="og:site_name" content="Ahead Of Time" />
    <!-- Favicon set: Google Search shows a square icon that is a multiple of
         48px, so link one explicitly (it ignores a missing tag and shows a
         blank globe). New filenames bust link-preview and favicon caches. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1a2841" />
    <meta property="og:image" content="https://aheadoftime.app/assets/aheadoftime-social-card-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ahead Of Time - Assistant for busy calendars" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ahead Of Time - The assistant for busy calendars" />
    <meta name="twitter:description" content="Calendars tell you when an event starts. Ahead Of Time makes sure you are ready when it does. Less scrambling. More headspace. Time to actually enjoy it." />
    <meta name="twitter:image" content="https://aheadoftime.app/assets/aheadoftime-social-card-v2.png" />
    <!-- Structured data for search engines and AI answer engines (GEO) -
         no JSON-LD existed anywhere before this. SoftwareApplication
         describes the product itself (free to start, web-based); WebSite
         identifies the site as a distinct entity from its content. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Ahead Of Time",
        "url": "https://aheadoftime.app/",
        "description": "Calendars tell you when an event starts. Ahead Of Time makes sure you are ready when it does. Describe an event or trip in plain language and it reverse-engineers a countdown of prep milestones, in Google Calendar, Apple Calendar or Outlook.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "image": "https://aheadoftime.app/icon-512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ahead Of Time",
        "url": "https://aheadoftime.app/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ahead Of Time",
        "url": "https://aheadoftime.app/",
        "logo": "https://aheadoftime.app/icon-512.png"
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google tag (gtag.js) is intentionally NOT bootstrapped here anymore.
         It used to load and auto-fire an initial pageview unconditionally on
         every page load, regardless of the cookie consent choice collected
         later by React - and independently double-counted that first
         pageview against the one src/services/analytics.ts's router-driven
         AnalyticsTracker already fires on every route. initAnalytics() in
         that file is now the single place GA ever loads or fires anything,
         gated on hasAnalyticsConsent() - nothing GA-related runs until the
         user has explicitly opted in. -->
  </head>
  <body>
    <div id="root">
      <noscript>
        <div class="font-sans p-6 text-center">
          <p>Ahead Of Time requires JavaScript to run the interactive calendar planner.</p>
          <p><a href="/privacy">Privacy Policy</a></p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
