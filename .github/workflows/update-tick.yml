name: Update tick

# Vercel's Hobby plan can only run a cron job once a day, but people choose the
# hour they want their update (Settings > Background Sync). This pings the
# scheduler every hour; the endpoint itself works out who is due (nobody gets
# more than one update per slot), so extra pings are harmless. Vercel's own
# daily cron stays as a fallback.
#
# Needs a repository secret named CRON_SECRET with the SAME value as the
# CRON_SECRET environment variable in Vercel. Without it this job does nothing.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the update scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set - skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aheadoftime.app/api/cron/agenda-scan"
          echo
